name: hiddify
description: A Proxy Frontend.
publish_to: "none"
version: 0.9.0+900

environment:
  sdk: ">=3.0.5 <4.0.0"

# OHOS 适配: Flutter 3.27 的 flutter_localizations 强制 intl 0.19,
# 而 humanizer 等旧包仍锁 intl 0.18,统一覆盖到 0.19。
dependency_overrides:
  intl: ^0.19.0
  # OHOS adapt: the Dart 3.6 toolchain resolves analyzer 6.x, but every
  # published custom_lint_core release ships sources that reference AST nodes
  # introduced in analyzer 8.x. That makes `dart run build_runner build` fail
  # before anything is generated, and the upstream package cannot be patched
  # because it is pulled in transitively by riverpod_analyzer_utils.
  #
  # The local shim below only exposes the `TypeChecker` helper, which is the
  # single symbol riverpod_analyzer_utils actually uses.
  custom_lint_core:
    path: G:/DevTemp/workbuddyDL/custom_lint_core_stub
  # go_router_builder 2.9.x targets the go_router 16.x API while the project
  # pins go_router 11.x, which makes the builder fail on `caseSensitive`.
  go_router_builder: 2.3.3
  # OHOS adapt: the OpenHarmony Flutter fork adds `TargetPlatform.ohos` to the
  # platform enum. flex_color_scheme 7.3.1 switches exhaustively over
  # TargetPlatform, so the extra value makes the package fail to compile.
  # The local copy only adds the missing `ohos` branches, which follow the
  # Android behaviour because HarmonyOS is a mobile platform.
  flex_color_scheme:
    path: G:/DevTemp/workbuddyDL/flex_color_scheme_ohos
  # OHOS adapt: Flutter 3.44 added the `scheduleNewFrame` named argument to
  # `SchedulerBinding.scheduleFrameCallback`, so combine 0.5.8's isolate
  # binding no longer satisfies the interface. The local copy only mirrors the
  # new signature (the method body still throws, as before).
  combine:
    path: G:/DevTemp/workbuddyDL/combine_ohos
  # OHOS adapt: the sqlite3 package only knows android/linux/iOS/macOS/windows
  # and its default loader throws `UnsupportedError: Unsupported platform:
  # ohos` on HarmonyOS (Platform.isLinux is false there). The local copy adds
  # an `ohos` branch that dlopen()s the bundled libsqlite3.so.
  #
  # The override has to live inside the package rather than in the app: drift
  # opens the database with `NativeDatabase.createInBackground`, i.e. inside a
  # background isolate, and an `open.overrideForAll` registered on the main
  # isolate is not visible from there.
  sqlite3:
    path: G:/DevTemp/workbuddyDL/sqlite3_ohos
  # OHOS adapt: protocol_handler has no HarmonyOS implementation, so
  # ProtocolRegistrar.instance falls through to the base class and
  # register() throws UnimplementedError. That exception escapes
  # DeepLinkService.build(), which aborts the bootstrap before runApp() and
  # leaves the app on the native splash screen. The local copy adds an `ohos`
  # registrar whose register() is a no-op, and skips the getInitialUrl()
  # method channel call (HarmonyOS delivers deep links through Want).
  protocol_handler:
    path: G:/DevTemp/workbuddyDL/protocol_handler_ohos
  # OHOS adapt: these plugins ship no `ohos` platform implementation, so every
  # platform channel call fails with MissingPluginException and the app never
  # gets past its bootstrap. The OpenHarmony community maintains federated
  # `_ohos` implementations; the Dart side of each package is pulled from the
  # matching branch so the versions stay in sync with its implementation.
  shared_preferences:
    path: G:/DevTemp/workbuddyDL/ohos_pkgs/fp/packages/shared_preferences/shared_preferences
  shared_preferences_ohos:
    path: G:/DevTemp/workbuddyDL/ohos_pkgs/fp/packages/shared_preferences/shared_preferences_ohos
  path_provider:
    path: G:/DevTemp/workbuddyDL/ohos_pkgs/fpp/packages/path_provider/path_provider
  path_provider_ohos:
    path: G:/DevTemp/workbuddyDL/ohos_pkgs/fpp/packages/path_provider/path_provider_ohos
  package_info_plus_ohos:
    path: G:/DevTemp/workbuddyDL/ohos_pkgs/pip

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  slang: ^3.24.0
  slang_flutter: ^3.24.0
  timeago: ^3.5.0
  flutter_localized_locales: ^2.0.5

  # data & serialization
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # state management
  hooks_riverpod: ^2.4.1
  flutter_hooks: ^0.20.1
  riverpod_annotation: ^2.1.6
  rxdart: ^0.27.7

  # persistence
  drift: ^2.12.1
  sqlite3_flutter_libs: ^0.5.16
  shared_preferences: ^2.2.1

  # networking
  dio: ^5.3.3
  web_socket_channel: ^2.4.0

  # native
  ffi: ^2.1.0
  path_provider: ^2.1.1
  flutter_local_notifications: ^15.1.1
  mobile_scanner: ^3.4.1
  protocol_handler: ^0.1.5
  flutter_native_splash: ^2.3.2
  share_plus: ^7.1.0
  window_manager: ^0.3.6
  tray_manager: ^0.2.0
  package_info_plus: ^4.1.0
  url_launcher: ^6.1.14
  vclibs: ^0.1.0
  launch_at_startup: ^0.2.2

  # analytics
  sentry_flutter: ^7.10.1
  sentry_dart_plugin: ^1.6.2
  sentry_dio: ^7.10.1

  # utils
  combine: ^0.5.6
  path: ^1.8.3
  loggy: ^2.0.3
  flutter_loggy: ^2.0.2
  meta: ^1.9.1
  stack_trace: ^1.11.0
  dartx: ^1.2.0
  uuid: ^3.0.7
  tint: ^2.0.1
  accessibility_tools: ^1.0.0
  neat_periodic_task: ^2.0.1
  retry: ^3.1.2

  # widgets
  go_router: ^11.1.2
  flex_color_scheme: ^7.3.1
  flutter_animate: ^4.2.0+1
  flutter_svg: ^2.0.7
  gap: ^3.0.1
  percent_indicator: ^4.2.3
  fluttertoast: ^8.2.2
  sliver_tools: ^0.2.12
  flutter_adaptive_scaffold: ^0.1.7+1
  humanizer: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  freezed: ^2.4.3
  riverpod_generator: ^2.3.3
  drift_dev: ^2.12.1
  ffigen: ^8.0.2
  slang_build_runner: ^3.24.0
  flutter_gen_runner: ^5.3.2
  go_router_builder: ^2.3.3
  icons_launcher: ^2.1.4
  # OHOS adapt: custom_lint / riverpod_lint are dev-only lint tooling. Their
  # analyzer plugin does not match the analyzer version resolved for the
  # HarmonyOS toolchain and breaks `dart run build_runner build`, which is
  # required to produce the freezed/json_serializable sources. They are not
  # needed to build or run the app, so they are disabled on this branch.
  # custom_lint: ^0.5.3
  # riverpod_lint: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/core/geoip.db
    - assets/core/geosite.db
    - assets/images/logo.svg
    - assets/images/tray_icon.ico
    - assets/images/tray_icon.png
    - assets/images/tray_icon_connected.ico
    - assets/images/tray_icon_disconnected.ico

  fonts:
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

icons_launcher:
  image_path: "assets/images/source/ic_launcher_border.png"
  platforms:
    android:
      enable: true
      image_path: "assets/images/source/ic_launcher_border.png"
      # adaptive_background_color: "#ffffff"
      adaptive_background_image: "assets/images/source/ic_launcher_background.png"
      adaptive_foreground_image: "assets/images/source/ic_launcher_foreground.png"
      adaptive_round_image: "assets/images/source/ic_launcher_round.png"
      adaptive_monochrome_image: "assets/images/source/ic_launcher_monochrome.png"
    ios:
      enable: true
      image_path: "assets/images/source/ic_launcher_rectangle.png"
    macos:
      enable: true
      image_path: "assets/images/source/ic_launcher_border.png"
    linux:
      enable: true
      image_path: "assets/images/source/ic_launcher_border.png"
    windows:
      enable: true
      image_path: "assets/images/source/ic_launcher_transparent.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/source/ic_launcher_splash.png
  android_gravity: center
  android_12:
    color: "#ffffff"
    image: assets/images/source/ic_launcher_foreground.png

ffigen:
  name: "SingboxNativeLibrary"
  description: "Bindings to Singbox"
  output: "lib/gen/singbox_generated_bindings.dart"
  headers:
    entry-points:
      - "libcore/bin/libcore.h"

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
  log_level: info
  ignore_missing: true
