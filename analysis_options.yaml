include: package:lint/strict.yaml

analyzer:
  exclude:
    - "libcore/**"
    - "**.g.dart"
    - "lib/gen/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    sort_pub_dependencies: false
    sort_unnamed_constructors_first: false
    avoid_classes_with_only_static_members: false

# OHOS adapt: the custom_lint analyzer plugin is disabled together with the
# matching dev dependencies (see pubspec.yaml) because it is incompatible with
# the analyzer version used by the HarmonyOS toolchain.
